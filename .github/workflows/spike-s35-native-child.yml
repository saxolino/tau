# W11 a3 verification (native-dependency-resolution charter, I7): the link refusal every native
# sandbox now carries, on the operating systems PR CI does not run. Dispatched from the spike branch
# only; the PR keeps main's copy of this file. Runs the existing desktop producers as CI already runs
# them, then the native-process seam (containment, link refusal) and the real build123d and PicoGK
# integration files under the new profile.
name: Spike S35 (native-only runtime child)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to verify'
        required: true
        default: 'spike/w11-a3-link-refusal'

permissions:
  actions: read
  contents: read

concurrency:
  group: spike-s35-${{ inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  links:
    name: W11 a3 link refusal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            build123d: prepare-build123d-python-macos
            picogk: prepare-picogk-dotnet-macos
          - os: macos-26
            build123d: prepare-build123d-python-macos
            picogk: prepare-picogk-dotnet-macos
          - os: ubuntu-latest
            build123d: prepare-build123d-python
            picogk: prepare-picogk-dotnet
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Nx Environment
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'
          save-pnpm-store: 'false'

      - name: Setup Linux sandbox prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-sandbox

      - name: Install uv
        if: runner.os == 'macOS'
        run: |
          command -v uv || pipx install uv
          uv --version

      - name: Native-process seam (containment and link refusal)
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          set -o pipefail
          (cd packages/core/native-process && pnpm exec vitest run src/native-sandbox.integration.test.ts --reporter=verbose) 2>&1 | tee "$RUNNER_TEMP/evidence/native-process.log"

      - name: Prepare PicoGK .NET and its layer (desktop producers)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.picogk }}
        run: |
          pnpm nx run "desktop:$TARGET"
          pnpm nx run picogk:prepare-layer --excludeTaskDependencies

      - name: PicoGK native integration under the new profile
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          (cd packages/plugins/picogk && pnpm exec vitest run src/picogk.native.integration.test.ts src/picogk.native-sandbox.integration.test.ts src/picogk.native-lifecycle.integration.test.ts --reporter=verbose) 2>&1 | tee "$RUNNER_TEMP/evidence/picogk.log"

      - name: Seed build123d
        run: pnpm nx run build123d:seed

      - name: build123d native integration under the new profile
        run: |
          set -o pipefail
          (cd packages/plugins/build123d && pnpm exec vitest run src/build123d.native.integration.test.ts src/build123d.native-sandbox.integration.test.ts --reporter=verbose) 2>&1 | tee "$RUNNER_TEMP/evidence/build123d.log"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w11-a3-links-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
