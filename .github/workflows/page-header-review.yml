name: Page header review evidence

on:
  push:
    branches: [codex/pr-600-header-evidence]
    paths:
      - .github/workflows/page-header-review.yml
      - out/artifacts/page-header-review/*.mjs

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  pnpm_config_verify_deps_before_run: warn
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  TAU_API_URL: http://localhost:4000
  TAU_WEBSOCKET_URL: ws://localhost:4001
  TAU_FRONTEND_URL: http://localhost:3000

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the review source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Verify UI source matches PR 600
        run: git diff --exit-code e13a98f2b186da045f6e08365de55ff7aba957a0 -- apps/ui apps/ui-e2e
      - name: Setup Nx
        uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'
          save-pnpm-store: 'false'
      - name: Identify prepared GeoSpec products
        id: products
        run: echo "key=geospec-transport-v1-$(node packages/geospec-engine-native/scripts/ci-artifacts.mjs product-key)" >> "$GITHUB_OUTPUT"
      - name: Restore prepared GeoSpec products
        uses: ./.github/actions/geospec-transport
        with:
          key: ${{ steps.products.outputs.key }}
          mode: restore
      - name: Verify the products
        run: pnpm nx run geospec-engine-native:require-geospec-artifacts
      - name: Build the UI
        run: pnpm nx build ui
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture and verify the rendered pages
        env:
          NODE_OPTIONS: --no-experimental-webstorage
          TAU_DEBUG: 'true'
          PORT: '3027'
        run: |
          mkdir -p out/research/page-headers
          pnpm nx serve ui --excludeTaskDependencies > out/research/page-headers/serve.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --silent --fail --max-time 5 http://localhost:3027/health/live > /dev/null; then break; fi
            sleep 2
          done
          node out/artifacts/page-header-review/capture.mjs | tee out/research/page-headers/capture.log
          node out/artifacts/page-header-review/interactions.mjs | tee out/research/page-headers/interactions.log
      - name: Save screenshots and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-600-page-header-review
          path: out/research/page-headers
          retention-days: 14
