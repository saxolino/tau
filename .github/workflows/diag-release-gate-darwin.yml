# Throwaway diagnosis for the macOS release gate (lane GATE). Never merged; the branch is deleted after.
# One macOS runner: the four targets run in sequence and each prints only its failure context.
name: Diagnose release gate on Darwin

on:
  push:
    branches: [diag/release-gate-darwin]

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose (macos-15)
    runs-on: macos-15
    timeout-minutes: 150
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nx
        with:
          node-version: '24.10.0'
          save-pnpm-store: 'false'
      - name: Tools on PATH
        run: |
          command -v uv || echo 'uv: not on PATH'
          command -v python3 && python3 --version
          sysctl -n hw.ncpu
      - name: Run the targets
        run: |
          overall=0
          for target in desktop:prepare-build123d-python 'cli:test -- src/commands/mcp.integration.test.ts' opencascade:test runtime:test; do
            status=0
            NX_SKIP_NX_CACHE=true pnpm nx run $target > "$RUNNER_TEMP/task.log" 2>&1 || status=$?
            sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/task.log" > "$RUNNER_TEMP/plain.log"
            echo "::group::$target exit $status"
            grep -nE -B3 -A40 'FAIL |Error:|ERR|Hook timed out|AssertionError|ENOENT|spawn|Failed tasks|DIAG' "$RUNNER_TEMP/plain.log" | cut -c1-400 | head -600 || true
            echo '--- tail ---'
            tail -60 "$RUNNER_TEMP/plain.log" | cut -c1-400
            echo '::endgroup::'
            echo "::notice title=$target::exit $status"
            [ "$status" = 0 ] || overall=1
          done
          exit "$overall"
